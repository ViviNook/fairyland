```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    background:
        radial-gradient(
            ellipse at center,
            #142d52 0%,
            #0d2445 38%,
            #081b37 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

}


/* =========================================================
   STARS
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.85) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.75) .5px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .8px,
            transparent 1.3px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.65) .8px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.65) .9px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.85) 1.1px,
            transparent 1.8px
        );

    background-size:

        71px 79px,
        107px 119px,
        149px 163px,
        197px 211px,
        251px 269px,
        317px 337px,
        421px 449px;

    background-position:

        17px 23px,
        43px 71px,
        89px 31px,
        127px 103px,
        19px 157px,
        181px 47px,
        73px 233px;

    opacity: .92;

}


/* =========================================================
   TEAL AURORA
   ========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: -15%;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 0% 50%,
            rgba(37,211,206,.20),
            rgba(24,175,185,.12) 14%,
            rgba(20,140,170,.05) 27%,
            transparent 42%
        ),

        radial-gradient(
            ellipse at 100% 48%,
            rgba(53,216,209,.18),
            rgba(30,174,190,.10) 15%,
            rgba(20,120,170,.04) 28%,
            transparent 43%
        ),

        radial-gradient(
            ellipse at 50% 0%,
            rgba(40,180,205,.08),
            transparent 40%
        );

    filter: blur(18px);

    z-index: 1;

}


/* =========================================================
   SKY
   ========================================================= */

.sky {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   CLOUD LAYER
   ========================================================= */

.cloud-layer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

}


/* =========================================================
   ALL CLOUDS
   ========================================================= */

.cloud {

    position: absolute;

    height: auto;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 12px 20px rgba(0,0,0,.12)
        );

}


/* =========================================================
   CLOUD 1
   Large — upper left
   ========================================================= */

.cloud-one {

    width: 850px;

    left: -300px;

    top: -40px;

    opacity: .94;

    animation:
        floatOne
        11s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD 2
   Large — upper right
   ========================================================= */

.cloud-two {

    width: 650px;

    right: -260px;

    top: 4%;

    opacity: .82;

    transform: scaleX(-1);

    animation:
        floatTwo
        13s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD 3
   Same cloud asset, smaller
   Lower left
   ========================================================= */

.cloud-three {

    width: 470px;

    left: -180px;

    bottom: 3%;

    opacity: .55;

    filter:
        blur(1px)
        drop-shadow(
            0 10px 18px rgba(0,0,0,.10)
        );

    animation:
        floatThree
        15s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD 4
   Same cloud asset, smaller
   Lower right
   ========================================================= */

.cloud-four {

    width: 420px;

    right: -150px;

    bottom: 12%;

    opacity: .48;

    transform: scaleX(-1);

    filter:
        blur(1px)
        drop-shadow(
            0 10px 18px rgba(0,0,0,.10)
        );

    animation:
        floatFour
        17s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD ANIMATIONS
   ========================================================= */

@keyframes floatOne {

    0%,
    100% {

        transform:
            translate3d(0, 0, 0);

    }

    50% {

        transform:
            translate3d(18px, -9px, 0);

    }

}


@keyframes floatTwo {

    0%,
    100% {

        transform:
            scaleX(-1)
            translate3d(0, 0, 0);

    }

    50% {

        transform:
            scaleX(-1)
            translate3d(-20px, 8px, 0);

    }

}


@keyframes floatThree {

    0%,
    100% {

        transform:
            translate3d(0, 0, 0);

    }

    50% {

        transform:
            translate3d(14px, -7px, 0);

    }

}


@keyframes floatFour {

    0%,
    100% {

        transform:
            scaleX(-1)
            translate3d(0, 0, 0);

    }

    50% {

        transform:
            scaleX(-1)
            translate3d(-15px, -6px, 0);

    }

}


/* =========================================================
   TITLE
   ========================================================= */

.title {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(760px, 72vw);

    text-align: center;

    z-index: 10;

}


.title h1 {

    margin: 0;

    font-size: 54px;

    font-weight: 300;

    letter-spacing: 7px;

    color: #fffaf0;

    text-shadow:

        0 0 18px rgba(255,255,255,.10),

        0 0 35px rgba(170,210,255,.08);

}


.title p {

    margin: 14px 0 0;

    font-size: 20px;

    line-height: 1.8;

    letter-spacing: 1px;

    opacity: .78;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cloud-one {

        width: 560px;

        left: -220px;

    }

    .cloud-two {

        width: 450px;

        right: -200px;

    }

    .cloud-three {

        width: 330px;

        left: -140px;

    }

    .cloud-four {

        width: 300px;

        right: -120px;

    }

    .title {

        width: 86vw;

    }

    .title h1 {

        font-size: 39px;

        letter-spacing: 5px;

    }

    .title p {

        font-size: 16px;

    }

}

</style>

</head>


<body>

<div class="sky">


    <!-- =====================================================
         CLOUDS
         ===================================================== -->

    <div class="cloud-layer">

        <img
            src="alienized-clouds-7081496.png"
            class="cloud cloud-one"
            alt=""
        >

        <img
            src="95c-cloud-2421760.png"
            class="cloud cloud-two"
            alt=""
        >

        <img
            src="alienized-clouds-7081496.png"
            class="cloud cloud-three"
            alt=""
        >

        <img
            src="95c-cloud-2421760.png"
            class="cloud cloud-four"
            alt=""
        >

    </div>


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <div class="title">

        <h1>WELCOME, DREAMER.</h1>

        <p>
            The clouds keep more than rain.
        </p>

    </div>


</div>

</body>

</html>
