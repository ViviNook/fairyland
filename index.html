<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

    body {
background: radial-gradient(
    ellipse at center,
    #20395d 0%,
    #243f61 45%,
    #304564 72%,
    #46506b 88%,
    #5d5870 100%
);
    color: #fff8e8;
    font-family: Georgia, serif;
}

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,0.55) 0.5px, transparent 0.8px),
        radial-gradient(circle, rgba(255,255,255,0.35) 0.4px, transparent 0.7px),
        radial-gradient(circle, rgba(255,255,255,0.45) 0.5px, transparent 0.8px);

    background-size: 130px 150px, 190px 210px, 250px 230px;
    background-position: 20px 40px, 80px 120px, 150px 70px;
}
   .cloud-wisp {
    position: fixed;
    width: 500px;
    height: 180px;
    top: 18%;
    left: 8%;

    opacity: 0.9;
    pointer-events: none;
} 
     .welcome {
    width: 100%;
    height: 100vh;
    transition: opacity 2s ease;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 0 0 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.8;
        }

        .enter {
            margin-top: 25px;

            padding: 13px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: Georgia, serif;
            font-size: 15px;

            cursor: pointer;
        }

        .enter:hover {
            background: rgba(255,255,255,0.18);
        }
@keyframes whoosh {
    0% {
        transform: translateX(0) rotate(0deg);
    }

    100% {
        transform: translateX(120vw) rotate(15deg);
    }
}
        @keyframes breathe {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}
</style>
</head>

<body>
<body>

    <svg class="cloud-wisp" viewBox="0 0 500 180" aria-hidden="true">
        <path d="M20 120
                 C80 80, 105 135, 150 105
                 C195 75, 205 30, 250 45
                 C295 60, 275 115, 330 105
                 C385 95, 390 55, 430 70
                 C465 82, 455 115, 490 120"
              fill="none"
              stroke="rgba(245,248,250,0.65)"
              stroke-width="22"
              stroke-linecap="round"
              filter="url(#softCloud)" />

        <defs>
            <filter id="softCloud">
                <feGaussianBlur stdDeviation="7"/>
            </filter>
        </defs>
    </svg>

    <div class="welcome">
    <div class="welcome">

        <h1>WELCOME, DREAMER.</h1>

        <p>
            There are stories hiding in the sky.<br>
            Wander softly. Look closely.
        </p>

       <button class="enter" onclick="enterSky()">
    ENTER THE SKY ☁
</button>

    </div>
<script>
function enterSky() {
    const welcome = document.querySelector(".welcome");
    welcome.style.animation = "whoosh 1.5s ease-in forwards";
}
</script>
</body>

</html>
