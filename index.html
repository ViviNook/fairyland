<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">


<style>

/* =========================================================
   BASE
   ========================================================= */

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            ellipse at center,
            #142d52 0%,
            #0d2445 38%,
            #081b37 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

}


/* =========================================================
   STAR FIELD
   ========================================================= */

body::before {

    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.80) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.75) .5px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .8px,
            transparent 1.3px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.65) .8px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.65) .9px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.85) 1.1px,
            transparent 1.8px
        ),

        radial-gradient(
            circle,
            rgba(180,240,240,.65) 1px,
            transparent 1.8px
        ),

        radial-gradient(
            circle,
            rgba(255,250,225,.95) 1.5px,
            transparent 2.5px
        );

    background-size:

        47px 53px,
        63px 71px,
        79px 91px,
        103px 117px,
        137px 151px,
        167px 181px,
        211px 229px,
        271px 293px,
        389px 421px;

    background-position:

        13px 21px,
        41px 67px,
        73px 11px,
        101px 89px,
        19px 143px,
        157px 37px,
        61px 191px,
        233px 83px,
        91px 271px;

    opacity: .92;

}


/* =========================================================
   TEAL AURORA EDGES
   ========================================================= */

body::after {

    content: "";

    position: fixed;
    inset: -15%;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 0% 50%,
            rgba(37,211,206,.20),
            rgba(24,175,185,.12) 14%,
            rgba(20,140,170,.05) 27%,
            transparent 42%
        ),

        radial-gradient(
            ellipse at 100% 48%,
            rgba(53,216,209,.18),
            rgba(30,174,190,.10) 15%,
            rgba(20,120,170,.04) 28%,
            transparent 43%
        ),

        radial-gradient(
            ellipse at 50% 0%,
            rgba(40,180,205,.08),
            transparent 40%
        );

    filter: blur(18px);

}


/* =========================================================
   MAIN WORLD
   ========================================================= */

.sky {

    width: 100%;
    height: 100vh;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

}


/* =========================================================
   CENTRAL TITLE
   ========================================================= */

.title {

    position: relative;

    text-align: center;

    z-index: 5;

}

.title h1 {

    margin: 0;

    font-size: 58px;

    font-weight: 300;

    letter-spacing: 9px;

    color: #fffaf0;

    text-shadow:
        0 0 18px rgba(255,255,255,.10),
        0 0 35px rgba(255,210,120,.06);

}

.title p {

    margin: 14px 0 0;

    font-size: 19px;

    letter-spacing: 2px;

    opacity: .72;

}


/* =========================================================
   GOLD FILIGREE FRAME
   ========================================================= */

.filigree {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(760px, 82vw);
    height: 270px;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    z-index: 4;

}


/* =========================================================
   MAIN GOLD LINES
   ========================================================= */

.filigree::before,
.filigree::after {

    content: "";

    position: absolute;

    top: 50%;

    width: 37%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(231,193,103,.15),
            rgba(245,211,126,.95),
            rgba(231,193,103,.25),
            transparent
        );

    box-shadow:
        0 0 7px rgba(244,204,110,.18);

}

.filigree::before {

    left: 0;

}

.filigree::after {

    right: 0;

}


/* =========================================================
   ORNAMENT CORNERS
   ========================================================= */

.ornament {

    position: absolute;

    width: 115px;
    height: 115px;

    color: #e8c46f;

    opacity: .92;

}


/* TOP LEFT */

.ornament.tl {

    top: 0;
    left: 0;

}


/* TOP RIGHT */

.ornament.tr {

    top: 0;
    right: 0;

    transform:
        scaleX(-1);

}


/* BOTTOM LEFT */

.ornament.bl {

    bottom: 0;
    left: 0;

    transform:
        scaleY(-1);

}


/* BOTTOM RIGHT */

.ornament.br {

    bottom: 0;
    right: 0;

    transform:
        scale(-1);

}


/* =========================================================
   FILIGREE DRAWING
   ========================================================= */

.ornament svg {

    width: 100%;
    height: 100%;

    overflow: visible;

}

.ornament path {

    fill: none;

    stroke: currentColor;

    stroke-width: 1.4;

    stroke-linecap: round;

    stroke-linejoin: round;

}

.ornament .fine {

    stroke-width: .8;

    opacity: .75;

}

.ornament circle {

    fill: #e8c46f;

}


/* =========================================================
   LITTLE CENTER DIAMOND
   ========================================================= */

.center-gem {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 6px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    background: #f1d27c;

    box-shadow:
        0 0 9px rgba(241,210,124,.65);

}


/* =========================================================
   SIDE CURLS
   ========================================================= */

.side-curl {

    position: absolute;

    top: 50%;

    width: 95px;
    height: 70px;

    transform: translateY(-50%);

}

.side-curl.left {

    left: 26%;

}

.side-curl.right {

    right: 26%;

    transform:
        translateY(-50%)
        scaleX(-1);

}

.side-curl svg {

    width: 100%;
    height: 100%;

}

.side-curl path {

    fill: none;

    stroke: #e8c46f;

    stroke-width: 1.3;

    stroke-linecap: round;

    opacity: .9;

}


/* =========================================================
   SUBTLE GOLD FLOAT
   ========================================================= */

.filigree {

    animation:
        goldBreath
        7s
        ease-in-out
        infinite;

}

@keyframes goldBreath {

    0%,
    100% {

        opacity: .82;

    }

    50% {

        opacity: 1;

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 650px) {

    .title h1 {

        font-size: 39px;

        letter-spacing: 5px;

    }

    .title p {

        font-size: 16px;

    }

    .filigree {

        width: 94vw;

    }

}

</style>

</head>
