```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    background:

        radial-gradient(
            ellipse at center,
            #17345b 0%,
            #10294c 38%,
            #091d3a 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

}


/* =========================================================
   SKY
   ========================================================= */

.sky {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   STARS
   ========================================================= */

.sky::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.90) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.78) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .6px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .85px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.62) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.60) 1px,
            transparent 1.6px
        );

    background-size:

        71px 79px,
        107px 119px,
        149px 163px,
        197px 211px,
        251px 269px,
        317px 337px;

    background-position:

        17px 23px,
        43px 71px,
        89px 31px,
        127px 103px,
        19px 157px,
        181px 47px;

    opacity: .94;

    z-index: 1;

}


/* =========================================================
   TEAL AURORA — EDGE GLOW
   ========================================================= */

.sky::after {

    content: "";

    position: absolute;

    inset: -18%;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 0% 45%,
            rgba(37,211,206,.25),
            rgba(24,175,185,.15) 13%,
            rgba(20,140,170,.07) 27%,
            transparent 43%
        ),

        radial-gradient(
            ellipse at 100% 52%,
            rgba(53,216,209,.23),
            rgba(30,174,190,.13) 14%,
            rgba(20,120,170,.06) 28%,
            transparent 44%
        ),

        radial-gradient(
            ellipse at 50% 0%,
            rgba(40,190,210,.10),
            transparent 38%
        ),

        radial-gradient(
            ellipse at 50% 100%,
            rgba(25,155,180,.07),
            transparent 40%
        );

    filter: blur(20px);

    z-index: 2;

}


/* =========================================================
   CLOUD WORLD
   ========================================================= */

.cloud-world {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;

}


/* =========================================================
   CLOUD BASE
   ========================================================= */

.cloud {

    position: absolute;

    display: block;

    height: auto;

    pointer-events: none;

    user-select: none;

    will-change: transform;

    filter:
        drop-shadow(
            0 14px 22px rgba(0,0,0,.10)
        );

}


/* =========================================================
   LARGE LEFT CLOUD
   ========================================================= */

.cloud-main {

    width: 820px;

    left: -330px;

    top: -80px;

    opacity: .92;

    animation:
        cloudDriftOne
        15s
        ease-in-out
        infinite;

}


/* =========================================================
   NEW MULTI-CLOUD PNG
   Floating higher/right — NOT MIRRORED
   ========================================================= */

.cloud-cluster {

    width: 760px;

    right: -390px;

    top: -150px;

    opacity: .70;

    animation:
        cloudDriftTwo
        19s
        ease-in-out
        infinite;

}


/* =========================================================
   SMALL DISTANT CLOUD
   ========================================================= */

.cloud-low {

    width: 420px;

    left: -170px;

    bottom: -55px;

    opacity: .46;

    filter:
        blur(1px)
        drop-shadow(
            0 10px 18px rgba(0,0,0,.10)
        );

    animation:
        cloudDriftThree
        21s
        ease-in-out
        infinite;

}


/* =========================================================
   TINY BACKGROUND CLOUD
   ========================================================= */

.cloud-far {

    width: 300px;

    right: -90px;

    bottom: 3%;

    opacity: .28;

    filter:
        blur(2px);

    animation:
        cloudDriftFour
        24s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD MOVEMENT
   ========================================================= */

@keyframes cloudDriftOne {

    0%,
    100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(20px, -10px, 0);
    }

}


@keyframes cloudDriftTwo {

    0%,
    100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-24px, 12px, 0);
    }

}


@keyframes cloudDriftThree {

    0%,
    100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(18px, -8px, 0);
    }

}


@keyframes cloudDriftFour {

    0%,
    100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-12px, -6px, 0);
    }

}


/* =========================================================
   CENTRAL CONTENT
   ========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(760px, 82vw);

    text-align: center;

    z-index: 10;

    animation:
        dreamFloat
        7s
        ease-in-out
        infinite;

}


/* =========================================================
   TITLE
   ========================================================= */

.content h1 {

    margin: 0;

    font-size: clamp(40px, 5vw, 58px);

    font-weight: 300;

    letter-spacing: 8px;

    color: #fffaf0;

    text-shadow:

        0 0 18px rgba(255,255,255,.13),

        0 0 38px rgba(170,210,255,.10);

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.content p {

    margin: 15px 0 30px;

    font-size: 20px;

    line-height: 1.7;

    letter-spacing: 1px;

    color: #fffaf0;

    opacity: .80;

}


/* =========================================================
   DREAM BUTTON
   ========================================================= */

.enter-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 170px;

    padding: 13px 30px;

    border: 1px solid rgba(255,236,185,.55);

    border-radius: 999px;

    background:

        rgba(255,248,220,.055);

    color: #fff8df;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter: blur(5px);

    box-shadow:

        0 0 18px rgba(255,235,180,.06);

    transition:

        background .4s ease,
        box-shadow .4s ease,
        transform .4s ease;

}


.enter-button:hover {

    background:

        rgba(255,248,220,.11);

    box-shadow:

        0 0 28px rgba(255,235,180,.14);

    transform:
        translateY(-2px);

}


/* =========================================================
   CENTRAL FLOAT
   ========================================================= */

@keyframes dreamFloat {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            translateY(0);

    }

    50% {

        transform:
            translate(-50%, -50%)
            translateY(-7px);

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cloud-main {

        width: 570px;

        left: -250px;

        top: -40px;

    }

    .cloud-cluster {

        width: 500px;

        right: -280px;

        top: -70px;

    }

    .cloud-low {

        width: 300px;

        left: -140px;

        bottom: -30px;

    }

    .cloud-far {

        width: 220px;

        right: -80px;

    }

    .content {

        width: 88vw;

    }

    .content h1 {

        font-size: 38px;

        letter-spacing: 5px;

    }

    .content p {

        font-size: 16px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .cloud,
    .content {

        animation: none;

    }

}

</style>

</head>


<body>


<div class="sky">


    <!-- =====================================================
         CLOUDS
         ===================================================== -->

    <div class="cloud-world">

        <img
            src="alienized-clouds-7081496.png"
            class="cloud cloud-main"
            alt=""
        >

        <img
            src="placidplace-sky-7296025.png"
            class="cloud cloud-cluster"
            alt=""
        >

        <img
            src="95c-cloud-2421760.png"
            class="cloud cloud-low"
            alt=""
        >

        <img
            src="placidplace-sky-7296025.png"
            class="cloud cloud-far"
            alt=""
        >

    </div>


    <!-- =====================================================
         CENTRAL DREAMER CONTENT
         ===================================================== -->

    <main class="content">

        <h1>
            WELCOME, DREAMER.
        </h1>

        <p>
            The clouds keep more than rain.
        </p>

        <button
            class="enter-button"
            type="button"
            onclick="enterSky()"
        >
            ENTER THE SKY
        </button>

    </main>


</div>


<script>

function enterSky() {

    document.body.classList.add("entering");

}

</script>

</body>

</html>
```
