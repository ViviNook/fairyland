<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

    body {
background: red;
    color: #fff8e8;
    font-family: Georgia, serif;
}

   
     
     
     .welcome {
    width: 100%;
    height: 100vh;
    transition: opacity 2s ease;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 0 0 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.8;
        }

        .enter {
            margin-top: 25px;

            padding: 13px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: Georgia, serif;
            font-size: 15px;

            cursor: pointer;
        }

        .enter:hover {
            background: rgba(255,255,255,0.18);
        }
@keyframes whoosh {
    0% {
        transform: translateX(0) rotate(0deg);
    }

    100% {
        transform: translateX(120vw) rotate(15deg);
    }
}
        @keyframes breathe {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}
</style>
</head>

<body>

    <div class="welcome">

        <h1>WELCOME, DREAMER.</h1>

        <p>
            There are stories hiding in the sky.<br>
            Wander softly. Look closely.
        </p>

       <button class="enter" onclick="enterSky()">
    ENTER THE SKY ☁
</button>

    </div>
<script>
function enterSky() {
    const welcome = document.querySelector(".welcome");
    welcome.style.animation = "whoosh 1.5s ease-in forwards";
}
</script>
</body>

</html>
