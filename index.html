<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

    body {
background: radial-gradient(
    ellipse at center,
    #20395d 0%,
    #243f61 45%,
    #304564 72%,
    #46506b 88%,
    #5d5870 100%
);
    color: #fff8e8;
    font-family: Georgia, serif;
}

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,0.55) 0.5px, transparent 0.8px),
        radial-gradient(circle, rgba(255,255,255,0.35) 0.4px, transparent 0.7px),
        radial-gradient(circle, rgba(255,255,255,0.45) 0.5px, transparent 0.8px);

    background-size: 130px 150px, 190px 210px, 250px 230px;
    background-position: 20px 40px, 80px 120px, 150px 70px;

}
     .welcome {
    width: 100%;
    height: 100vh;
    transition: opacity 2s ease;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 0 0 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.8;
        }

        .enter {
            margin-top: 25px;

            padding: 13px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: Georgia, serif;
            font-size: 15px;

            cursor: pointer;
        }

        .enter:hover {
            background: rgba(255,255,255,0.18);
        }
@keyframes whoosh {
    0% {
        transform: translateX(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateX(120vw) rotate(8deg);
        opacity: 0;
    }
}
       .wind-title span {
    display: inline-block;
    transform-origin: center bottom;
}
    .wind-blown .wind-title span {
  animation: letterWind 1.5s linear forwards;
    animation-delay: calc(var(--i) * 0.04s);
}
     .wind-title span:nth-child(1)  { --wind-x: 115vw; --wind-y: -4vh;  --wind-rotate: 20deg; --wind-skew: 8deg; }
.wind-title span:nth-child(2)  { --wind-x: 120vw; --wind-y: 2vh;   --wind-rotate: 16deg; --wind-skew: 6deg; }
.wind-title span:nth-child(3)  { --wind-x: 118vw; --wind-y: -6vh;  --wind-rotate: 22deg; --wind-skew: 9deg; }
.wind-title span:nth-child(4)  { --wind-x: 123vw; --wind-y: 3vh;   --wind-rotate: 18deg; --wind-skew: 7deg; }
.wind-title span:nth-child(5)  { --wind-x: 117vw; --wind-y: -3vh;  --wind-rotate: 21deg; --wind-skew: 8deg; }
.wind-title span:nth-child(6)  { --wind-x: 122vw; --wind-y: -5vh;  --wind-rotate: 19deg; --wind-skew: 7deg; }
.wind-title span:nth-child(7)  { --wind-x: 119vw; --wind-y: 2vh;   --wind-rotate: 23deg; --wind-skew: 8deg; }
.wind-title span:nth-child(8)  { --wind-x: 121vw; --wind-y: -4vh;  --wind-rotate: 17deg; --wind-skew: 7deg; }
.wind-title span:nth-child(9)  { --wind-x: 124vw; --wind-y: 3vh;   --wind-rotate: 20deg; --wind-skew: 8deg; }
.wind-title span:nth-child(10) { --wind-x: 118vw; --wind-y: -5vh;  --wind-rotate: 22deg; --wind-skew: 9deg; }
.wind-title span:nth-child(11) { --wind-x: 123vw; --wind-y: 2vh;   --wind-rotate: 18deg; --wind-skew: 6deg; }
.wind-title span:nth-child(12) { --wind-x: 120vw; --wind-y: -3vh;  --wind-rotate: 21deg; --wind-skew: 8deg; }
.wind-title span:nth-child(13) { --wind-x: 122vw; --wind-y: -4vh;  --wind-rotate: 19deg; --wind-skew: 7deg; }
.wind-title span:nth-child(14) { --wind-x: 119vw; --wind-y: 3vh;   --wind-rotate: 22deg; --wind-skew: 8deg; }
.wind-title span:nth-child(15) { --wind-x: 124vw; --wind-y: -2vh;  --wind-rotate: 17deg; --wind-skew: 6deg; }
.wind-title span:nth-child(16) { --wind-x: 121vw; --wind-y: 4vh;   --wind-rotate: 20deg; --wind-skew: 7deg; }
@keyframes letterWind {
    0% {
        transform: translate(0, 0) rotate(0deg) skewX(0deg);
        opacity: 1;
    }

    15% {
        transform: translate(8vw, -1vh) rotate(3deg) skewX(2deg);
        opacity: 1;
    }

    100% {
        transform:
            translate(var(--wind-x), var(--wind-y))
            rotate(var(--wind-rotate))
            skewX(var(--wind-skew));
        opacity: 0;
    }
}
        @keyframes breathe {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}
    .wispy-cloud {
    position: fixed;
    width: 280px;
    height: 90px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 50%;
    filter: blur(12px);
}

.cloud-one {
    top: 18%;
    left: 12%;
}
</style>
</head>

<body>
    <audio id="windSound" src="449991__djt4nn3r__whoosh_long_high.wav"></audio>
    <div class="welcome">

     <h1 class="wind-title">
    <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
    <span>,</span>
    <span>D</span><span>R</span><span>E</span><span>A</span><span>M</span><span>E</span><span>R</span><span>.</span>
</h1>

        <p>
    The clouds keep more than rain.
</p>

       <button class="enter" onclick="enterSky()">
    ENTER THE SKY ☁
</button>

    </div>
    <div class="wispy-cloud cloud-one"></div>
<script>
function enterSky() {
    const welcome = document.querySelector(".welcome");
    const wind = document.getElementById("windSound");

    wind.currentTime = 0;
wind.play().catch(error => console.log(error));

    welcome.classList.add("wind-blown");
}
</script>
</body>

</html>
