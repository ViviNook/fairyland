<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #314d73 0%,
                    #243f61 42%,
                    #20395d 68%,
                    #394863 86%,
                    #5d5870 100%
                );

            color: #fff8e8;
            font-family: "Cormorant Garamond", Georgia, serif;
        }

        /* Soft distant stars */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                radial-gradient(circle, rgba(255,255,255,0.8) 0.7px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.55) 0.5px, transparent 0.9px),
                radial-gradient(circle, rgba(255,238,190,0.5) 0.8px, transparent 1.2px),
                radial-gradient(circle, rgba(255,255,255,0.35) 0.5px, transparent 0.8px);

            background-size:
                150px 170px,
                210px 230px,
                280px 260px,
                370px 340px;

            background-position:
                20px 40px,
                90px 130px,
                160px 70px,
                40px 180px;

            opacity: 0.9;
        }

        /* A very subtle central glow for depth */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0.06),
                    transparent 55%
                );

            opacity: 0.8;
        }

        .welcome {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }

        h1 {
            font-size: 54px;
            font-weight: 300;
            letter-spacing: 7px;
            margin: 0 0 16px;

            text-shadow:
                0 0 18px rgba(255,255,255,0.08);
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            letter-spacing: 1px;
            opacity: 0.78;

            margin: 0;
        }

        .enter {
            margin-top: 25px;

            padding: 12px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 17px;
            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        .enter:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }

        /* The original simple wind trajectory */
        .wind-title span {
            display: inline-block;
        }

        .wind-blown .wind-title span {
            animation: letterWind 1.35s ease-in forwards;
            animation-delay: calc(var(--i) * 0.035s);
        }

        .wind-title span:nth-child(1)  { --i: 0; }
        .wind-title span:nth-child(2)  { --i: 1; }
        .wind-title span:nth-child(3)  { --i: 2; }
        .wind-title span:nth-child(4)  { --i: 3; }
        .wind-title span:nth-child(5)  { --i: 4; }
        .wind-title span:nth-child(6)  { --i: 5; }
        .wind-title span:nth-child(7)  { --i: 6; }
        .wind-title span:nth-child(8)  { --i: 7; }
        .wind-title span:nth-child(9)  { --i: 8; }
        .wind-title span:nth-child(10) { --i: 9; }
        .wind-title span:nth-child(11) { --i: 10; }
        .wind-title span:nth-child(12) { --i: 11; }
        .wind-title span:nth-child(13) { --i: 12; }
        .wind-title span:nth-child(14) { --i: 13; }
        .wind-title span:nth-child(15) { --i: 14; }
        .wind-title span:nth-child(16) { --i: 15; }

        @keyframes letterWind {
            0% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateX(120vw) rotate(8deg);
                opacity: 0;
            }
        }

        /* Subtitle and button follow the same wind */
        .wind-blown p,
        .wind-blown .enter {
            animation: elementWind 1.35s ease-in forwards;
        }

        .wind-blown p {
            animation-delay: 0.08s;
        }

        .wind-blown .enter {
            animation-delay: 0.13s;
        }

        @keyframes elementWind {
            0% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateX(120vw) rotate(8deg);
                opacity: 0;
            }
        }

        @keyframes breathe {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>

<body>

    <audio
        id="windSound"
        src="449991__djt4nn3r__whoosh_long_high.wav"
        preload="auto">
    </audio>

    <div class="welcome">

        <h1 class="wind-title">
            <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
            <span>,</span>
            <span>D</span><span>R</span><span>E</span><span>A</span><span>M</span><span>E</span><span>R</span><span>.</span>
        </h1>

        <p>
            The clouds keep more than rain.
        </p>

        <button class="enter" onclick="enterSky()">
            ENTER THE SKY ☁
        </button>

    </div>

    <script>
        function enterSky() {
            const welcome = document.querySelector(".welcome");
            const wind = document.getElementById("windSound");

            /* Start the sound just before the visual movement */
            wind.currentTime = 0;
            wind.play().catch(error => console.log(error));

            setTimeout(() => {
                welcome.classList.add("wind-blown");
            }, 80);
        }
    </script>

</body>

</html>
