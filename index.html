<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           BASE
           ===================================================== */

        html,
        body {

            margin: 0;
            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background:

                radial-gradient(
                    ellipse at center,
                    #142d52 0%,
                    #0d2445 38%,
                    #081b37 68%,
                    #06152d 100%
                );

            color: #fffaf0;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

        }


        /* =====================================================
           DEEP TEAL AURORA — EDGES
           ===================================================== */

        body::after {

            content: "";

            position: fixed;

            inset: -15%;

            pointer-events: none;

            background:

                /* LEFT TEAL */
                radial-gradient(
                    ellipse at 0% 50%,
                    rgba(37, 211, 206, 0.20) 0%,
                    rgba(24, 175, 185, 0.12) 14%,
                    rgba(20, 140, 170, 0.05) 27%,
                    transparent 42%
                ),

                /* RIGHT TEAL */
                radial-gradient(
                    ellipse at 100% 48%,
                    rgba(53, 216, 209, 0.18) 0%,
                    rgba(30, 174, 190, 0.10) 15%,
                    rgba(20, 120, 170, 0.04) 28%,
                    transparent 43%
                ),

                /* TOP */
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(40, 180, 205, 0.08),
                    transparent 40%
                ),

                /* VERY SOFT CENTER LIGHT */
                radial-gradient(
                    ellipse at center,
                    rgba(170, 210, 255, 0.045),
                    transparent 58%
                );

            filter: blur(18px);

            opacity: 1;

        }


        /* =====================================================
           STAR FIELD
           ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:

                /* tiny stars */
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.80) 0.45px,
                    transparent 0.9px
                ),

                radial-gradient(
                    circle,
                    rgba(215,235,255,0.75) 0.5px,
                    transparent 1px
                ),

                radial-gradient(
                    circle,
                    rgba(255,248,220,0.70) 0.55px,
                    transparent 1px
                ),

                /* small stars */
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.75) 0.8px,
                    transparent 1.3px
                ),

                radial-gradient(
                    circle,
                    rgba(180,225,255,0.65) 0.8px,
                    transparent 1.4px
                ),

                radial-gradient(
                    circle,
                    rgba(255,238,190,0.65) 0.9px,
                    transparent 1.5px
                ),

                /* medium stars */
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.85) 1.1px,
                    transparent 1.8px
                ),

                radial-gradient(
                    circle,
                    rgba(180,240,240,0.65) 1px,
                    transparent 1.8px
                ),

                /* occasional bright stars */
                radial-gradient(
                    circle,
                    rgba(255,250,225,0.95) 1.5px,
                    transparent 2.5px
                );

            background-size:

                47px 53px,
                63px 71px,
                79px 91px,
                103px 117px,
                137px 151px,
                167px 181px,
                211px 229px,
                271px 293px,
                389px 421px;

            background-position:

                13px 21px,
                41px 67px,
                73px 11px,
                101px 89px,
                19px 143px,
                157px 37px,
                61px 191px,
                233px 83px,
                91px 271px;

            opacity: 0.92;

        }


        /* =====================================================
           WELCOME SCREEN
           ===================================================== */

        .welcome {

            width: 100%;
            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            animation:
                breathe
                6s
                ease-in-out
                infinite;

        }


        /* =====================================================
           TITLE
           ===================================================== */

        h1 {

            font-size: 54px;

            font-weight: 300;

            letter-spacing: 7px;

            margin: 0 0 16px;

            color: #fffdf5;

            text-shadow:

                0 0 15px rgba(255,255,255,0.12),

                0 0 35px rgba(170,210,255,0.08);

        }


        /* =====================================================
           SUBTITLE
           ===================================================== */

        p {

            font-size: 20px;

            line-height: 1.8;

            letter-spacing: 1px;

            opacity: 0.78;

            margin: 0;

        }


        /* =====================================================
           ENTER BUTTON
           ===================================================== */

        .enter {

            margin-top: 25px;

            padding: 12px 28px;

            border:
                1px solid rgba(255,255,255,0.48);

            border-radius: 30px;

            background:
                rgba(255,255,255,0.065);

            color: white;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 17px;

            letter-spacing: 1px;

            cursor: pointer;

            transition:

                background 0.3s ease,

                transform 0.3s ease,

                box-shadow 0.3s ease;

        }


        .enter:hover {

            background:
                rgba(255,255,255,0.14);

            transform:
                translateY(-2px);

            box-shadow:
                0 0 22px rgba(100,220,220,0.10);

        }


        /* =====================================================
           THE TEXT LEAVES AS ONE WHOLE OBJECT
           ===================================================== */

        .wind-title,
        .wind-subtitle,
        .enter {

            will-change: transform, opacity;

        }


        /* =====================================================
           SMOOTH SIDEWAYS YEET

           IMPORTANT:
           Almost-linear movement = no weird hesitation.

           The tiny cubic curve only gives it a gentle
           beginning and ending without that "STOP... GO"
           feeling.
           ===================================================== */

        .wind-blown .wind-title,
        .wind-blown .wind-subtitle,
        .wind-blown .enter {

            animation:

                yeetSideways
                1.35s
                cubic-bezier(0.25, 0.92, 0.45, 1)
                forwards;

        }


        @keyframes yeetSideways {

            0% {

                transform:
                    translate3d(0, 0, 0);

                opacity: 1;

            }


            15% {

                transform:
                    translate3d(11vw, 0, 0);

                opacity: 1;

            }


            30% {

                transform:
                    translate3d(27vw, 0, 0);

                opacity: 0.99;

            }


            50% {

                transform:
                    translate3d(51vw, 0, 0);

                opacity: 0.95;

            }


            70% {

                transform:
                    translate3d(76vw, 0, 0);

                opacity: 0.78;

            }


            85% {

                transform:
                    translate3d(99vw, 0, 0);

                opacity: 0.42;

            }


            100% {

                transform:
                    translate3d(132vw, 0, 0);

                opacity: 0;

            }

        }


        /* =====================================================
           GENTLE FLOAT BEFORE ENTER
           ===================================================== */

        @keyframes breathe {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-9px);

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         WHOOSH
         ===================================================== -->

    <audio
        id="windSound"
        src="449991__djt4nn3r__whoosh_long_high.wav"
        preload="auto">
    </audio>


    <!-- =====================================================
         WELCOME
         ===================================================== -->

    <div class="welcome">


        <h1 class="wind-title">

            WELCOME, DREAMER.

        </h1>


        <p class="wind-subtitle">

            The clouds keep more than rain.

        </p>


        <button
            class="enter"
            onclick="enterSky()">

            ENTER THE SKY ☁

        </button>


    </div>


    <script>

        function enterSky() {

            const welcome =
                document.querySelector(".welcome");

            const wind =
                document.getElementById("windSound");


            /* Start sound immediately */

            wind.currentTime = 0;

            wind.play().catch(
                error => console.log(error)
            );


            /* Tiny delay lets the click register
               before the visual movement begins */

            requestAnimationFrame(() => {

                welcome.classList.add(
                    "wind-blown"
                );

            });

        }

    </script>


</body>

</html>
