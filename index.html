<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at center,
            #17345b 0%,
            #10294c 38%,
            #091d3a 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
}


/* =========================================================
   SKY
   ========================================================= */

.sky {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================================================
   DENSE STAR FIELD
   ========================================================= */

.sky::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.90) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.78) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .6px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .85px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.62) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.60) 1px,
            transparent 1.6px
        );

    background-size:
        71px 79px,
        107px 119px,
        149px 163px,
        197px 211px,
        251px 269px,
        317px 337px;

    background-position:
        17px 23px,
        43px 71px,
        89px 31px,
        127px 103px,
        19px 157px,
        181px 47px;

    opacity: .94;

    z-index: 1;
}


/* =========================================================
   STRONGER TEAL AURORA AROUND EDGES
   ========================================================= */

.sky::after {
    content: "";

    position: absolute;

    inset: -15%;

    pointer-events: none;

    background:

        /* LEFT EDGE */
        radial-gradient(
            ellipse at -1% 50%,
            rgba(31, 239, 224, .52) 0%,
            rgba(26, 213, 213, .38) 9%,
            rgba(21, 183, 196, .24) 19%,
            rgba(20, 150, 180, .12) 31%,
            transparent 46%
        ),

        /* RIGHT EDGE */
        radial-gradient(
            ellipse at 101% 50%,
            rgba(46, 238, 222, .50) 0%,
            rgba(30, 211, 211, .36) 9%,
            rgba(25, 178, 196, .23) 19%,
            rgba(20, 145, 180, .11) 31%,
            transparent 46%
        ),

        /* TOP EDGE */
        radial-gradient(
            ellipse at 50% -5%,
            rgba(38, 216, 218, .24) 0%,
            rgba(30, 183, 200, .12) 22%,
            transparent 45%
        ),

        /* BOTTOM EDGE */
        radial-gradient(
            ellipse at 50% 105%,
            rgba(28, 201, 204, .22) 0%,
            rgba(24, 164, 187, .11) 23%,
            transparent 45%
        );

    filter: blur(18px);

    z-index: 2;
}


/* =========================================================
   CLOUD LAYER
   ========================================================= */

.clouds {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 5;
}


/* =========================================================
   EVERY CLOUD
   ========================================================= */

.cloud {
    position: absolute;

    height: auto;

    display: block;

    pointer-events: none;
    user-select: none;

    will-change: transform;

    object-fit: contain;
}


/* =========================================================
   CLOUD 1 — LARGE TOP LEFT
   ========================================================= */

.cloud-1 {
    width: 410px;

    left: -115px;
    top: -70px;

    opacity: .62;

    animation:
        cloudFloat1
        21s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 2 — HIGH RIGHT
   ========================================================= */

.cloud-2 {
    width: 330px;

    right: -70px;
    top: 5%;

    opacity: .48;

    animation:
        cloudFloat2
        25s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 3 — LEFT SIDE
   ========================================================= */

.cloud-3 {
    width: 260px;

    left: -75px;
    top: 28%;

    opacity: .40;

    animation:
        cloudFloat3
        27s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 4 — RIGHT SIDE, HIGHER
   ========================================================= */

.cloud-4 {
    width: 300px;

    right: -90px;
    top: 32%;

    opacity: .42;

    animation:
        cloudFloat4
        23s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 5 — LOWER LEFT
   ========================================================= */

.cloud-5 {
    width: 340px;

    left: -95px;
    bottom: 8%;

    opacity: .48;

    animation:
        cloudFloat5
        29s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 6 — LOWER RIGHT
   ========================================================= */

.cloud-6 {
    width: 270px;

    right: -65px;
    bottom: 21%;

    opacity: .36;

    animation:
        cloudFloat6
        26s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 7 — BOTTOM, SLIGHTLY LEFT OF CENTER
   ========================================================= */

.cloud-7 {
    width: 390px;

    left: 17%;
    bottom: -120px;

    opacity: .46;

    animation:
        cloudFloat7
        31s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD 8 — BOTTOM RIGHT / CORNER
   ========================================================= */

.cloud-8 {
    width: 350px;

    right: 11%;
    bottom: -105px;

    opacity: .40;

    animation:
        cloudFloat8
        28s
        ease-in-out
        infinite;
}


/* =========================================================
   SMALL ATMOSPHERIC CLOUD BEHIND TEXT
   ========================================================= */

.cloud-behind {
    width: 205px;

    left: 59%;
    top: 40%;

    opacity: .13;

    filter:
        saturate(.20)
        brightness(.90)
        blur(.8px);

    z-index: 7;

    animation:
        cloudBehind
        18s
        ease-in-out
        infinite;
}


/* =========================================================
   CLOUD FLOATING
   ========================================================= */

@keyframes cloudFloat1 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(25px, 13px, 0);
    }
}


@keyframes cloudFloat2 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-23px, 18px, 0);
    }
}


@keyframes cloudFloat3 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(18px, -12px, 0);
    }
}


@keyframes cloudFloat4 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-27px, 9px, 0);
    }
}


@keyframes cloudFloat5 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(26px, -14px, 0);
    }
}


@keyframes cloudFloat6 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-21px, -11px, 0);
    }
}


@keyframes cloudFloat7 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(22px, -15px, 0);
    }
}


@keyframes cloudFloat8 {

    0%, 100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(-19px, -12px, 0);
    }
}


@keyframes cloudBehind {

    0%, 100% {
        transform:
            translate3d(0, 0, 0)
            rotate(-2deg);
    }

    50% {
        transform:
            translate3d(-24px, -15px, 0)
            rotate(2deg);
    }
}


/* =========================================================
   CENTRAL CONTENT
   ========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(760px, 82vw);

    text-align: center;

    z-index: 10;

    animation:
        dreamFloat
        6s
        ease-in-out
        infinite;
}


/* =========================================================
   TITLE
   ========================================================= */

.content h1 {

    margin: 0;

    font-size:
        clamp(40px, 5vw, 58px);

    font-weight: 300;

    letter-spacing: 8px;

    color: #fffaf0;

    text-shadow:
        0 0 18px rgba(255,255,255,.14),
        0 0 40px rgba(170,210,255,.11);
}


/* =========================================================
   SUBTITLE
   ========================================================= */

.content p {

    margin:
        14px 0 30px;

    font-size: 20px;

    line-height: 1.7;

    letter-spacing: 1px;

    color: #fffaf0;

    opacity: .80;
}


/* =========================================================
   BUTTON
   ========================================================= */

.enter-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 175px;

    padding:
        13px 30px;

    border:
        1px solid rgba(255,236,185,.58);

    border-radius:
        999px;

    background:
        rgba(255,248,220,.055);

    color:
        #fff8df;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter:
        blur(5px);

    box-shadow:
        0 0 18px rgba(255,235,180,.06);

    transition:
        background .4s ease,
        box-shadow .4s ease,
        transform .4s ease;
}


.enter-button:hover {

    background:
        rgba(255,248,220,.11);

    box-shadow:
        0 0 30px rgba(255,235,180,.15);

    transform:
        translateY(-2px);
}


/* =========================================================
   NOTICEABLE TEXT FLOAT
   ========================================================= */

@keyframes dreamFloat {

    0% {
        transform:
            translate(-50%, -50%)
            translateY(9px);
    }

    50% {
        transform:
            translate(-50%, -50%)
            translateY(-11px);
    }

    100% {
        transform:
            translate(-50%, -50%)
            translateY(9px);
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cloud-1 {
        width: 300px;
        left: -105px;
        top: -40px;
    }

    .cloud-2 {
        width: 245px;
        right: -70px;
        top: 3%;
    }

    .cloud-3 {
        width: 200px;
        left: -80px;
        top: 27%;
    }

    .cloud-4 {
        width: 220px;
        right: -70px;
        top: 31%;
    }

    .cloud-5 {
        width: 260px;
        left: -95px;
        bottom: 8%;
    }

    .cloud-6 {
        width: 205px;
        right: -60px;
        bottom: 20%;
    }

    .cloud-7 {
        width: 290px;
        left: 4%;
        bottom: -90px;
    }

    .cloud-8 {
        width: 270px;
        right: -15px;
        bottom: -85px;
    }

    .cloud-behind {
        width: 150px;
        left: 57%;
        top: 41%;
    }

    .content {
        width: 88vw;
    }

    .content h1 {
        font-size: 38px;
        letter-spacing: 5px;
    }

    .content p {
        font-size: 16px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .cloud,
    .content {
        animation: none;
    }
}

</style>

</head>


<body>

<div class="sky">

    <div class="clouds">

        <img
            src="cloud_1.png"
            class="cloud cloud-1"
            alt=""
        >

        <img
            src="cloud_2.png"
            class="cloud cloud-2"
            alt=""
        >

        <img
            src="cloud_3.png"
            class="cloud cloud-3"
            alt=""
        >

        <img
            src="cloud_4.png"
            class="cloud cloud-4"
            alt=""
        >

        <img
            src="cloud_5.png"
            class="cloud cloud-5"
            alt=""
        >

        <img
            src="cloud_6.png"
            class="cloud cloud-6"
            alt=""
        >

        <img
            src="cloud_7.png"
            class="cloud cloud-7"
            alt=""
        >

        <img
            src="cloud_8.png"
            class="cloud cloud-8"
            alt=""
        >

        <!-- small atmospheric cloud behind title -->
        <img
            src="cloud_4.png"
            class="cloud cloud-behind"
            alt=""
        >

    </div>


    <main class="content">

        <h1>
            WELCOME, DREAMER.
        </h1>

        <p>
            The clouds keep more than rain.
        </p>

        <button
            class="enter-button"
            type="button"
            onclick="enterSky()"
        >
            ENTER THE SKY
        </button>

    </main>

</div>


<script>

function enterSky() {

    document.body.classList.add("entering");

}

</script>

</body>

</html>
