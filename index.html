<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =====================================================
           DEEP MIDNIGHT BLUE
           ===================================================== */

        body {
            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #314d73 0%,
                    #243f61 42%,
                    #20395d 68%,
                    #394863 86%,
                    #5d5870 100%
                );

            color: #fff8e8;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;
        }


        /* =====================================================
           STAR FIELD
           ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:

                /* tiny distant stars */
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.75) 0.5px,
                    transparent 0.9px
                ),

                radial-gradient(
                    circle,
                    rgba(220,230,255,0.55) 0.5px,
                    transparent 0.9px
                ),

                /* medium stars */
                radial-gradient(
                    circle,
                    rgba(255,238,190,0.65) 0.8px,
                    transparent 1.2px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.55) 0.9px,
                    transparent 1.4px
                ),

                /* slightly closer stars */
                radial-gradient(
                    circle,
                    rgba(255,245,215,0.65) 1.2px,
                    transparent 1.8px
                ),

                radial-gradient(
                    circle,
                    rgba(200,220,255,0.45) 1.4px,
                    transparent 2px
                );

            background-size:
                85px 95px,
                125px 140px,
                175px 190px,
                230px 250px,
                330px 350px,
                470px 500px;

            background-position:
                20px 30px,
                80px 110px,
                150px 70px,
                40px 180px,
                210px 100px,
                70px 280px;

            opacity: 0.9;
        }


        /* =====================================================
           SUBTLE AURORA / ABYSS GLOW
           ===================================================== */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at 0% 50%,
                    rgba(80,190,210,0.07),
                    transparent 32%
                ),

                radial-gradient(
                    ellipse at 100% 45%,
                    rgba(100,130,230,0.07),
                    transparent 32%
                ),

                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(80,170,220,0.035),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0.06),
                    transparent 55%
                );

            opacity: 0.9;
        }


        /* =====================================================
           WELCOME SCREEN
           ===================================================== */

        .welcome {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            animation:
                breathe 6s ease-in-out infinite;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        h1 {
            font-size: 54px;

            font-weight: 300;

            letter-spacing: 7px;

            margin: 0 0 16px;

            text-shadow:
                0 0 18px rgba(255,255,255,0.08),
                0 0 35px rgba(150,190,255,0.05);
        }


        /* =====================================================
           SUBTITLE
           ===================================================== */

        p {
            font-size: 20px;

            line-height: 1.8;

            letter-spacing: 1px;

            opacity: 0.78;

            margin: 0;
        }


        /* =====================================================
           ENTER BUTTON
           ===================================================== */

        .enter {
            margin-top: 25px;

            padding: 12px 28px;

            border:
                1px solid rgba(255,255,255,0.5);

            border-radius: 30px;

            background:
                rgba(255,255,255,0.08);

            color: white;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 17px;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        .enter:hover {
            background:
                rgba(255,255,255,0.18);

            transform:
                translateY(-2px);
        }


        /* =====================================================
           EVERYTHING LEAVES AS ONE ENTITY
           ===================================================== */

       
.wind-blown .wind-title,
.wind-blown .wind-subtitle,
.wind-blown .enter {
    animation: yeetSideways 1.15s cubic-bezier(0.65, 0, 1, 0.4) forwards;
}

@keyframes yeetSideways {

    0% {
        transform: translateX(0);
        opacity: 1;
    }

    55% {
        transform: translateX(35vw);
        opacity: 1;
    }

    100% {
        transform: translateX(130vw);
        opacity: 0;
    }
}
        /* =====================================================
           MAGIC CARPET / STIFF SHEET MOTION

           Slight bend
           Slight mirror-like flip
           Then WHOOSH
           ===================================================== */

       
        
          
        /* =====================================================
           GENTLE BREATHING
           ===================================================== */

        @keyframes breathe {

            0%, 100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-10px)
                    scale(1.006);
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         WIND SOUND
         ===================================================== -->

    <audio
        id="windSound"
        src="449991__djt4nn3r__whoosh_long_high.wav"
        preload="auto">
    </audio>


    <!-- =====================================================
         WELCOME SCREEN
         ===================================================== -->

    <div class="welcome">


        <h1 class="wind-title">
            <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
            <span>,</span>
            <span>D</span><span>R</span><span>E</span><span>A</span><span>M</span><span>E</span><span>R</span><span>.</span>
        </h1>


        <p class="wind-subtitle">
            <span>T</span><span>h</span><span>e</span>
            <span> </span>
            <span>c</span><span>l</span><span>o</span><span>u</span><span>d</span><span>s</span>
            <span> </span>
            <span>k</span><span>e</span><span>e</span><span>p</span>
            <span> </span>
            <span>m</span><span>o</span><span>r</span><span>e</span>
            <span> </span>
            <span>t</span><span>h</span><span>a</span><span>n</span>
            <span> </span>
            <span>r</span><span>a</span><span>i</span><span>n</span><span>.</span>
        </p>


        <button
            class="enter"
            onclick="enterSky()">

            ENTER THE SKY ☁

        </button>


    </div>


    <script>

        function enterSky() {

            const welcome =
                document.querySelector(".welcome");

            const wind =
                document.getElementById("windSound");


            /* Whoosh begins just before movement */

            wind.currentTime = 0;

            wind.play().catch(
                error => console.log(error)
            );


            setTimeout(() => {

                welcome.classList.add(
                    "wind-blown"
                );

            }, 60);

        }

    </script>


</body>

</html>
