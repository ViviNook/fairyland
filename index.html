<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            ellipse at center,
            #17345b 0%,
            #10294c 38%,
            #091d3a 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
}


/* =========================================================
   SKY
   ========================================================= */

.sky {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   STARS
   ========================================================= */

.sky::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.90) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.78) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .6px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .85px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.62) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.60) 1px,
            transparent 1.6px
        );

    background-size:

        71px 79px,
        107px 119px,
        149px 163px,
        197px 211px,
        251px 269px,
        317px 337px;

    background-position:

        17px 23px,
        43px 71px,
        89px 31px,
        127px 103px,
        19px 157px,
        181px 47px;

    opacity: .94;

    z-index: 1;

}


/* =========================================================
   TEAL AURORA — EDGES
   ========================================================= */

.sky::after {

    content: "";

    position: absolute;

    inset: -20%;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at -3% 45%,
            rgba(37,211,206,.30),
            rgba(24,175,185,.17) 14%,
            rgba(20,140,170,.08) 27%,
            transparent 44%
        ),

        radial-gradient(
            ellipse at 103% 52%,
            rgba(53,216,209,.27),
            rgba(30,174,190,.15) 14%,
            rgba(20,120,170,.07) 29%,
            transparent 45%
        ),

        radial-gradient(
            ellipse at 50% -5%,
            rgba(40,190,210,.10),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 50% 105%,
            rgba(25,155,180,.08),
            transparent 40%
        );

    filter: blur(22px);

    z-index: 2;

}


/* =========================================================
   CLOUD LAYER
   ========================================================= */

.clouds {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 5;

}


/* =========================================================
   NORMAL CLOUD IMAGES
   ========================================================= */

.cloud {

    position: absolute;

    display: block;

    height: auto;

    pointer-events: none;

    user-select: none;

    will-change: transform;

}


/* =========================================================
   CLOUD FROM ASSET 1
   ========================================================= */

.cloud-a {

    width: 650px;

    left: -270px;

    top: -95px;

    opacity: .90;

    filter:
        drop-shadow(
            0 15px 25px rgba(0,0,0,.10)
        );

    animation:
        driftA
        17s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD FROM ASSET 2
   ========================================================= */

.cloud-b {

    width: 430px;

    right: -170px;

    bottom: -100px;

    opacity: .58;

    filter:
        blur(.7px)
        drop-shadow(
            0 12px 20px rgba(0,0,0,.10)
        );

    animation:
        driftB
        21s
        ease-in-out
        infinite;

}


/* =========================================================
   SPRITE CLOUDS
   ---------------------------------------------------------
   The third PNG contains 8 separate clouds arranged
   in 2 columns × 4 rows.

   Each element below displays ONLY ONE quadrant.
   ========================================================= */

.sprite-cloud {

    position: absolute;

    width: 470px;

    aspect-ratio: 2 / 1;

    background-image:
        url("placidplace-sky-7296025.png");

    background-repeat: no-repeat;

    /*
       The original image is 2 columns × 4 rows.
       200% width = each column
       400% height = each row
    */

    background-size:
        200% 400%;

    pointer-events: none;

    user-select: none;

    will-change: transform;

}


/* =========================================================
   ROW 1 — LEFT CLOUD
   ========================================================= */

.sprite-1 {

    left: -175px;

    top: 10%;

    opacity: .48;

    background-position:
        0% 0%;

    transform:
        scale(.92);

    animation:
        spriteFloat1
        24s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 1 — RIGHT CLOUD
   ========================================================= */

.sprite-2 {

    right: -220px;

    top: -3%;

    opacity: .52;

    background-position:
        100% 0%;

    transform:
        scale(.88);

    animation:
        spriteFloat2
        27s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 2 — LEFT CLOUD
   ========================================================= */

.sprite-3 {

    left: -190px;

    top: 31%;

    opacity: .36;

    background-position:
        0% 50%;

    transform:
        scale(.75);

    animation:
        spriteFloat3
        29s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 2 — RIGHT CLOUD
   ========================================================= */

.sprite-4 {

    right: -175px;

    top: 23%;

    opacity: .42;

    background-position:
        100% 50%;

    transform:
        scale(.80);

    animation:
        spriteFloat4
        25s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 3 — LEFT CLOUD
   ========================================================= */

.sprite-5 {

    left: 8%;

    bottom: -100px;

    opacity: .45;

    background-position:
        0% 66.666%;

    transform:
        scale(.82);

    animation:
        spriteFloat5
        30s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 3 — RIGHT CLOUD
   ========================================================= */

.sprite-6 {

    right: -130px;

    bottom: 12%;

    opacity: .31;

    background-position:
        100% 66.666%;

    transform:
        scale(.72);

    animation:
        spriteFloat6
        26s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 4 — LEFT CLOUD
   ========================================================= */

.sprite-7 {

    left: 25%;

    bottom: -145px;

    opacity: .40;

    background-position:
        0% 100%;

    transform:
        scale(.68);

    animation:
        spriteFloat7
        32s
        ease-in-out
        infinite;

}


/* =========================================================
   ROW 4 — RIGHT CLOUD
   ========================================================= */

.sprite-8 {

    right: 15%;

    bottom: -125px;

    opacity: .34;

    background-position:
        100% 100%;

    transform:
        scale(.63);

    animation:
        spriteFloat8
        28s
        ease-in-out
        infinite;

}


/* =========================================================
   SPECIAL CLOUD BEHIND THE TITLE
   ---------------------------------------------------------
   Small, faded, offset to the right.
   It passes behind the atmosphere of the title without
   sitting directly underneath it.
   ========================================================= */

.sprite-behind {

    width: 285px;

    aspect-ratio: 2 / 1;

    left: 58%;

    top: 38%;

    opacity: .14;

    background-position:
        100% 66.666%;

    filter:
        saturate(.25)
        blur(1px);

    z-index: 7;

    animation:
        behindFloat
        18s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD MOTION
   ========================================================= */

@keyframes driftA {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(28px, -13px, 0);
    }

}


@keyframes driftB {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(-24px, -11px, 0);
    }

}


@keyframes spriteFloat1 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: 25px;
        margin-top: -12px;
    }

}


@keyframes spriteFloat2 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: -22px;
        margin-top: 14px;
    }

}


@keyframes spriteFloat3 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: 17px;
        margin-top: -9px;
    }

}


@keyframes spriteFloat4 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: -27px;
        margin-top: -7px;
    }

}


@keyframes spriteFloat5 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: 23px;
        margin-top: -15px;
    }

}


@keyframes spriteFloat6 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: -20px;
        margin-top: 12px;
    }

}


@keyframes spriteFloat7 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: 15px;
        margin-top: -10px;
    }

}


@keyframes spriteFloat8 {

    0%,
    100% {
        margin-left: 0;
        margin-top: 0;
    }

    50% {
        margin-left: -18px;
        margin-top: -13px;
    }

}


@keyframes behindFloat {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            rotate(-2deg);
    }

    50% {
        transform:
            translate3d(-25px, -18px, 0)
            rotate(2deg);
    }

}


/* =========================================================
   CENTRAL CONTENT
   ========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(760px, 82vw);

    text-align: center;

    z-index: 10;

    /*
       Noticeable floating:
       7px → 18px rather than barely moving.
    */

    animation:
        dreamFloat
        6s
        ease-in-out
        infinite;

}


/* =========================================================
   TITLE
   ========================================================= */

.content h1 {

    margin: 0;

    font-size:
        clamp(40px, 5vw, 58px);

    font-weight: 300;

    letter-spacing: 8px;

    color: #fffaf0;

    text-shadow:

        0 0 18px rgba(255,255,255,.13),

        0 0 40px rgba(170,210,255,.10);

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.content p {

    margin:
        14px 0 30px;

    font-size: 20px;

    line-height: 1.7;

    letter-spacing: 1px;

    color: #fffaf0;

    opacity: .80;

}


/* =========================================================
   BUTTON
   ========================================================= */

.enter-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 175px;

    padding:
        13px 30px;

    border:
        1px solid rgba(255,236,185,.58);

    border-radius:
        999px;

    background:
        rgba(255,248,220,.055);

    color:
        #fff8df;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter:
        blur(5px);

    box-shadow:
        0 0 18px rgba(255,235,180,.06);

    transition:
        background .4s ease,
        box-shadow .4s ease,
        transform .4s ease;

}


.enter-button:hover {

    background:
        rgba(255,248,220,.11);

    box-shadow:
        0 0 30px rgba(255,235,180,.15);

    transform:
        translateY(-2px);

}


/* =========================================================
   MORE OBVIOUS DREAM FLOAT
   ========================================================= */

@keyframes dreamFloat {

    0% {

        transform:
            translate(-50%, -50%)
            translateY(8px);

    }

    50% {

        transform:
            translate(-50%, -50%)
            translateY(-10px);

    }

    100% {

        transform:
            translate(-50%, -50%)
            translateY(8px);

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cloud-a {

        width: 500px;

        left: -250px;

    }

    .cloud-b {

        width: 340px;

        right: -180px;

    }

    .sprite-cloud {

        width: 350px;

    }

    .sprite-1 {
        left: -170px;
        top: 7%;
    }

    .sprite-2 {
        right: -190px;
        top: 1%;
    }

    .sprite-3 {
        left: -170px;
        top: 32%;
    }

    .sprite-4 {
        right: -170px;
        top: 25%;
    }

    .sprite-5 {
        left: -40px;
        bottom: -80px;
    }

    .sprite-6 {
        right: -130px;
        bottom: 11%;
    }

    .sprite-7 {
        left: 8%;
        bottom: -110px;
    }

    .sprite-8 {
        right: -40px;
        bottom: -100px;
    }

    .sprite-behind {

        width: 220px;

        left: 56%;

        top: 39%;

    }

    .content {

        width: 88vw;

    }

    .content h1 {

        font-size: 38px;

        letter-spacing: 5px;

    }

    .content p {

        font-size: 16px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .cloud,
    .sprite-cloud,
    .content {

        animation: none;

    }

}

</style>

</head>


<body>

<div class="sky">


    <!-- =====================================================
         CLOUDS
         ===================================================== -->

    <div class="clouds">


        <!-- Original cloud asset #1 -->

        <img
            src="alienized-clouds-7081496.png"
            class="cloud cloud-a"
            alt=""
        >


        <!-- Original cloud asset #2 -->

        <img
            src="95c-cloud-2421760.png"
            class="cloud cloud-b"
            alt=""
        >


        <!-- =================================================
             THE 8 INDIVIDUAL CLOUDS
             FROM placidplace-sky-7296025.png
             ================================================= -->


        <!-- Row 1, left -->

        <div
            class="sprite-cloud sprite-1"
            aria-hidden="true"
        ></div>


        <!-- Row 1, right -->

        <div
            class="sprite-cloud sprite-2"
            aria-hidden="true"
        ></div>


        <!-- Row 2, left -->

        <div
            class="sprite-cloud sprite-3"
            aria-hidden="true"
        ></div>


        <!-- Row 2, right -->

        <div
            class="sprite-cloud sprite-4"
            aria-hidden="true"
        ></div>


        <!-- Row 3, left -->

        <div
            class="sprite-cloud sprite-5"
            aria-hidden="true"
        ></div>


        <!-- Row 3, right -->

        <div
            class="sprite-cloud sprite-6"
            aria-hidden="true"
        ></div>


        <!-- Row 4, left -->

        <div
            class="sprite-cloud sprite-7"
            aria-hidden="true"
        ></div>


        <!-- Row 4, right -->

        <div
            class="sprite-cloud sprite-8"
            aria-hidden="true"
        ></div>


        <!-- Small faded cloud behind the title -->

        <div
            class="sprite-cloud sprite-behind"
            aria-hidden="true"
        ></div>


    </div>


    <!-- =====================================================
         DREAMER
         ===================================================== -->

    <main class="content">

        <h1>
            WELCOME, DREAMER.
        </h1>

        <p>
            The clouds keep more than rain.
        </p>

        <button
            class="enter-button"
            type="button"
            onclick="enterSky()"
        >
            ENTER THE SKY
        </button>

    </main>


</div>


<script>

function enterSky() {

    document.body.classList.add("entering");

}

</script>

</body>

</html>
