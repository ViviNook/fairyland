<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

    <style>

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    ellipse at 50% 42%,
                    #263f68 0%,
                    #182f55 32%,
                    #102747 58%,
                    #091b37 78%,
                    #06142c 100%
                );

            color: #fff8e8;
            font-family: "Cormorant Garamond", Georgia, serif;
        }


        /* =====================================================
           DEEP SPACE STAR FIELD
           ===================================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:

                /* tiny distant stars */
                radial-gradient(circle,
                    rgba(255,255,255,0.75) 0.5px,
                    transparent 0.9px),

                radial-gradient(circle,
                    rgba(210,225,255,0.65) 0.6px,
                    transparent 1px),

                /* medium stars */
                radial-gradient(circle,
                    rgba(255,248,220,0.85) 0.9px,
                    transparent 1.4px),

                radial-gradient(circle,
                    rgba(255,255,255,0.7) 1px,
                    transparent 1.6px),

                /* slightly larger foreground stars */
                radial-gradient(circle,
                    rgba(255,245,210,0.95) 1.3px,
                    transparent 2px),

                radial-gradient(circle,
                    rgba(190,215,255,0.8) 1.5px,
                    transparent 2.3px),

                /* faint huge depth stars */
                radial-gradient(circle,
                    rgba(255,255,255,0.35) 2px,
                    transparent 3px);

            background-size:
                95px 110px,
                135px 145px,
                180px 195px,
                235px 250px,
                330px 310px,
                430px 390px,
                600px 570px;

            background-position:
                10px 20px,
                80px 110px,
                150px 40px,
                30px 180px,
                210px 90px,
                50px 260px,
                300px 170px;

            opacity: 0.95;
        }


        /* =====================================================
           CENTRAL DEPTH / ABYSS GLOW
           ===================================================== */

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    rgba(125,165,220,0.10),
                    transparent 42%
                ),
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(4,15,35,0.35),
                    transparent 65%
                );

            opacity: 1;
        }


        /* =====================================================
           WELCOME SCREEN
           ===================================================== */

        .welcome {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }


        h1 {
            font-size: 54px;
            font-weight: 300;
            letter-spacing: 7px;

            margin: 0 0 16px;

            text-shadow:
                0 0 18px rgba(255,255,255,0.10),
                0 0 45px rgba(150,190,255,0.08);
        }


        p {
            font-size: 20px;
            line-height: 1.8;
            letter-spacing: 1px;

            opacity: 0.80;

            margin: 0;
        }


        /* =====================================================
           ENTER BUTTON
           ===================================================== */

        .enter {
            margin-top: 25px;

            padding: 12px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 17px;
            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        .enter:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-3px);
        }


        /* =====================================================
           TITLE — LETTERS FLY OUT
           ===================================================== */

        .wind-title span {
            display: inline-block;
            transform-origin: center center;
        }


        .wind-blown .wind-title span {
            animation:
                titleWind 1.45s cubic-bezier(.35,.05,.25,1) forwards;

            animation-delay:
                calc(var(--i) * 0.025s);
        }


        .wind-title span:nth-child(1)  { --i: 0; }
        .wind-title span:nth-child(2)  { --i: 1; }
        .wind-title span:nth-child(3)  { --i: 2; }
        .wind-title span:nth-child(4)  { --i: 3; }
        .wind-title span:nth-child(5)  { --i: 4; }
        .wind-title span:nth-child(6)  { --i: 5; }
        .wind-title span:nth-child(7)  { --i: 6; }
        .wind-title span:nth-child(8)  { --i: 7; }
        .wind-title span:nth-child(9)  { --i: 8; }
        .wind-title span:nth-child(10) { --i: 9; }
        .wind-title span:nth-child(11) { --i: 10; }
        .wind-title span:nth-child(12) { --i: 11; }
        .wind-title span:nth-child(13) { --i: 12; }
        .wind-title span:nth-child(14) { --i: 13; }
        .wind-title span:nth-child(15) { --i: 14; }
        .wind-title span:nth-child(16) { --i: 15; }


        /* =====================================================
           TITLE WIND MOTION
           ===================================================== */

        @keyframes titleWind {

            0% {
                transform:
                    translateX(0)
                    translateY(0)
                    rotate(0deg)
                    rotateY(0deg)
                    scale(1);

                opacity: 1;
            }

            25% {
                transform:
                    translateX(15vw)
                    translateY(-2vh)
                    rotate(8deg)
                    rotateY(35deg)
                    scale(1.02);

                opacity: 1;
            }

            55% {
                transform:
                    translateX(45vw)
                    translateY(4vh)
                    rotate(-14deg)
                    rotateY(110deg)
                    scale(0.96);

                opacity: 0.8;
            }

            80% {
                transform:
                    translateX(82vw)
                    translateY(-5vh)
                    rotate(18deg)
                    rotateY(180deg)
                    scale(0.8);

                opacity: 0.35;
            }

            100% {
                transform:
                    translateX(125vw)
                    translateY(8vh)
                    rotate(25deg)
                    rotateY(360deg)
                    scale(0.65);

                opacity: 0;
            }
        }


        /* =====================================================
           SUBTITLE
           EACH LETTER MOVES,
           BUT THEY ALL START AND FINISH TOGETHER
           ===================================================== */

        .wind-subtitle span {
            display: inline-block;
            transform-origin: center center;
        }


        .wind-blown .wind-subtitle span {
            animation:
                subtitleWind 1.45s cubic-bezier(.35,.05,.25,1) forwards;

            /* NO STAGGER */
            animation-delay: 0s;
        }


        /* =====================================================
           SUBTITLE WIND MOTION
           ===================================================== */

        @keyframes subtitleWind {

            0% {
                transform:
                    translateX(0)
                    translateY(0)
                    rotate(0deg)
                    rotateY(0deg)
                    scale(1);

                opacity: 0.8;
            }

            25% {
                transform:
                    translateX(15vw)
                    translateY(-3vh)
                    rotate(-7deg)
                    rotateY(35deg)
                    scale(1.03);

                opacity: 0.8;
            }

            55% {
                transform:
                    translateX(47vw)
                    translateY(5vh)
                    rotate(13deg)
                    rotateY(120deg)
                    scale(0.94);

                opacity: 0.65;
            }

            80% {
                transform:
                    translateX(84vw)
                    translateY(-6vh)
                    rotate(-18deg)
                    rotateY(200deg)
                    scale(0.78);

                opacity: 0.25;
            }

            100% {
                transform:
                    translateX(125vw)
                    translateY(7vh)
                    rotate(25deg)
                    rotateY(360deg)
                    scale(0.6);

                opacity: 0;
            }
        }


        /* =====================================================
           BUTTON — FLOWY / BENDY / FLIPPING
           ===================================================== */

        .wind-blown .enter {
            animation:
                buttonWind 1.45s cubic-bezier(.35,.05,.25,1) forwards;

            animation-delay: 0s;
        }


        @keyframes buttonWind {

            0% {
                transform:
                    translateX(0)
                    translateY(0)
                    rotate(0deg)
                    rotateY(0deg)
                    skewX(0deg)
                    scale(1);

                opacity: 1;
            }

            25% {
                transform:
                    translateX(15vw)
                    translateY(2vh)
                    rotate(8deg)
                    rotateY(35deg)
                    skewX(4deg)
                    scale(1.03);

                opacity: 1;
            }

            55% {
                transform:
                    translateX(48vw)
                    translateY(-4vh)
                    rotate(-12deg)
                    rotateY(120deg)
                    skewX(-8deg)
                    scale(0.95);

                opacity: 0.7;
            }

            80% {
                transform:
                    translateX(85vw)
                    translateY(6vh)
                    rotate(17deg)
                    rotateY(220deg)
                    skewX(10deg)
                    scale(0.8);

                opacity: 0.25;
            }

            100% {
                transform:
                    translateX(125vw)
                    translateY(-7vh)
                    rotate(28deg)
                    rotateY(360deg)
                    skewX(12deg)
                    scale(0.6);

                opacity: 0;
            }
        }


        /* =====================================================
           MORE NOTICEABLE BREATHING
           ===================================================== */

        @keyframes breathe {

            0%, 100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-11px)
                    scale(1.008);
            }
        }

    </style>
</head>


<body>


    <!-- WIND SOUND -->

    <audio
        id="windSound"
        src="449991__djt4nn3r__whoosh_long_high.wav"
        preload="auto">
    </audio>


    <!-- WELCOME -->

    <div class="welcome">


        <h1 class="wind-title">

            <span>W</span>
            <span>E</span>
            <span>L</span>
            <span>C</span>
            <span>O</span>
            <span>M</span>
            <span>E</span>
            <span>,</span>

            <span>D</span>
            <span>R</span>
            <span>E</span>
            <span>A</span>
            <span>M</span>
            <span>E</span>
            <span>R</span>
            <span>.</span>

        </h1>


        <p class="wind-subtitle">

            <span>T</span>
            <span>h</span>
            <span>e</span>

            <span> </span>

            <span>c</span>
            <span>l</span>
            <span>o</span>
            <span>u</span>
            <span>d</span>
            <span>s</span>

            <span> </span>

            <span>k</span>
            <span>e</span>
            <span>e</span>
            <span>p</span>

            <span> </span>

            <span>m</span>
            <span>o</span>
            <span>r</span>
            <span>e</span>

            <span> </span>

            <span>t</span>
            <span>h</span>
            <span>a</span>
            <span>n</span>

            <span> </span>

            <span>r</span>
            <span>a</span>
            <span>i</span>
            <span>n</span>
            <span>.</span>

        </p>


        <button class="enter" onclick="enterSky()">
            ENTER THE SKY ☁
        </button>


    </div>


    <script>

        function enterSky() {

            const welcome =
                document.querySelector(".welcome");

            const wind =
                document.getElementById("windSound");


            /* Start the whoosh slightly before the movement */

            wind.currentTime = 0;

            wind.play().catch(
                error => console.log(error)
            );


            setTimeout(() => {

                welcome.classList.add("wind-blown");

            }, 60);

        }

    </script>


</body>

</html>
