<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Dreaming Sky</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

    body {
background: radial-gradient(
    ellipse at center,
    #20395d 0%,
    #243f61 45%,
    #304564 72%,
    #46506b 88%,
    #5d5870 100%
);
    color: #fff8e8;
    font-family: Georgia, serif;
}

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,0.55) 0.5px, transparent 0.8px),
        radial-gradient(circle, rgba(255,255,255,0.35) 0.4px, transparent 0.7px),
        radial-gradient(circle, rgba(255,255,255,0.45) 0.5px, transparent 0.8px);

    background-size: 130px 150px, 190px 210px, 250px 230px;
    background-position: 20px 40px, 80px 120px, 150px 70px;

}
     .welcome {
    width: 100%;
    height: 100vh;
    transition: opacity 2s ease;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            animation: breathe 6s ease-in-out infinite;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 6px;
            margin: 0 0 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.8;
        }

        .enter {
            margin-top: 25px;

            padding: 13px 28px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 30px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: Georgia, serif;
            font-size: 15px;

            cursor: pointer;
        }

        .enter:hover {
            background: rgba(255,255,255,0.18);
        }
@keyframes whoosh {
    0% {
        transform: translateX(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateX(120vw) rotate(8deg);
        opacity: 0;
    }
}
       .wind-title span {
    display: inline-block;
    transform-origin: center bottom;
}
    .wind-blown .wind-title span {
    animation: letterWind 1.5s ease-in forwards;
    animation-delay: calc(var(--i) * 0.04s);
}
        .wind-title span:nth-child(1) { --i: 0; }
.wind-title span:nth-child(2) { --i: 1; }
.wind-title span:nth-child(3) { --i: 2; }
.wind-title span:nth-child(4) { --i: 3; }
.wind-title span:nth-child(5) { --i: 4; }
.wind-title span:nth-child(6) { --i: 5; }
.wind-title span:nth-child(7) { --i: 6; }
.wind-title span:nth-child(8) { --i: 7; }
.wind-title span:nth-child(9) { --i: 8; }
.wind-title span:nth-child(10) { --i: 9; }
.wind-title span:nth-child(11) { --i: 10; }
.wind-title span:nth-child(12) { --i: 11; }
.wind-title span:nth-child(13) { --i: 12; }
.wind-title span:nth-child(14) { --i: 13; }
.wind-title span:nth-child(15) { --i: 14; }
.wind-title span:nth-child(16) { --i: 15; }
        .wind-title span:nth-child(1)  { --wind-x: 115vw; --wind-y: -8vh;  --wind-rotate: 28deg; --wind-skew: 14deg; }
.wind-title span:nth-child(2)  { --wind-x: 125vw; --wind-y: 4vh;   --wind-rotate: 18deg; --wind-skew: 10deg; }
.wind-title span:nth-child(3)  { --wind-x: 110vw; --wind-y: -16vh; --wind-rotate: 35deg; --wind-skew: 18deg; }
.wind-title span:nth-child(4)  { --wind-x: 130vw; --wind-y: 10vh;  --wind-rotate: 22deg; --wind-skew: 12deg; }
.wind-title span:nth-child(5)  { --wind-x: 118vw; --wind-y: -5vh;  --wind-rotate: 40deg; --wind-skew: 20deg; }
.wind-title span:nth-child(6)  { --wind-x: 135vw; --wind-y: -13vh; --wind-rotate: 25deg; --wind-skew: 15deg; }
.wind-title span:nth-child(7)  { --wind-x: 112vw; --wind-y: 7vh;   --wind-rotate: 32deg; --wind-skew: 11deg; }
.wind-title span:nth-child(8)  { --wind-x: 128vw; --wind-y: -10vh; --wind-rotate: 20deg; --wind-skew: 17deg; }
.wind-title span:nth-child(9)  { --wind-x: 120vw; --wind-y: 12vh;  --wind-rotate: 38deg; --wind-skew: 13deg; }
.wind-title span:nth-child(10) { --wind-x: 132vw; --wind-y: -7vh;  --wind-rotate: 24deg; --wind-skew: 19deg; }
.wind-title span:nth-child(11) { --wind-x: 115vw; --wind-y: -14vh; --wind-rotate: 34deg; --wind-skew: 15deg; }
.wind-title span:nth-child(12) { --wind-x: 138vw; --wind-y: 5vh;   --wind-rotate: 27deg; --wind-skew: 12deg; }
.wind-title span:nth-child(13) { --wind-x: 122vw; --wind-y: -9vh;  --wind-rotate: 42deg; --wind-skew: 21deg; }
.wind-title span:nth-child(14) { --wind-x: 130vw; --wind-y: 8vh;   --wind-rotate: 30deg; --wind-skew: 16deg; }
.wind-title span:nth-child(15) { --wind-x: 118vw; --wind-y: -12vh; --wind-rotate: 36deg; --wind-skew: 14deg; }
.wind-title span:nth-child(16) { --wind-x: 140vw; --wind-y: 3vh;   --wind-rotate: 26deg; --wind-skew: 18deg; }

@keyframes letterWind {
    0% {
        transform: translate(0, 0) rotate(0deg) skewX(0deg);
        opacity: 1;
    }

    30% {
        transform: translate(-4px, -3px) rotate(-5deg) skewX(-4deg);
        opacity: 1;
    }

    65% {
        transform: translate(25vw, -3vh) rotate(10deg) skewX(6deg);
        opacity: 0.9;
    }

    100% {
        transform: translate(var(--wind-x), var(--wind-y))
                   rotate(var(--wind-rotate))
                   skewX(var(--wind-skew));
        opacity: 0;
    }
}
        @keyframes breathe {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}
</style>
</head>

<body>
    <audio id="windSound" src="449991__djt4nn3r__whoosh_long_high.wav"></audio>
    <div class="welcome">

     <h1 class="wind-title">
    <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
    <span>,</span>
    <span>D</span><span>R</span><span>E</span><span>A</span><span>M</span><span>E</span><span>R</span><span>.</span>
</h1>

        <p>
    The clouds keep more than rain.
</p>

       <button class="enter" onclick="enterSky()">
    ENTER THE SKY ☁
</button>

    </div>
<script>
function enterSky() {
    const welcome = document.querySelector(".welcome");
    const wind = document.getElementById("windSound");

    wind.currentTime = 0;
wind.play().catch(error => console.log(error));

    welcome.classList.add("wind-blown");
}
</script>
</body>

</html>
