```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Dreaming Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    background:
        radial-gradient(
            ellipse at center,
            #17345b 0%,
            #10294c 38%,
            #091d3a 68%,
            #06152d 100%
        );

    color: #fffaf0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

}


/* =========================================================
   SKY
   ========================================================= */

.sky {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   STARS
   ========================================================= */

.sky::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.90) .45px,
            transparent .9px
        ),

        radial-gradient(
            circle,
            rgba(215,235,255,.78) .55px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,248,220,.70) .6px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.75) .85px,
            transparent 1.4px
        ),

        radial-gradient(
            circle,
            rgba(180,225,255,.62) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,238,190,.60) 1px,
            transparent 1.6px
        );

    background-size:

        71px 79px,
        107px 119px,
        149px 163px,
        197px 211px,
        251px 269px,
        317px 337px;

    background-position:

        17px 23px,
        43px 71px,
        89px 31px,
        127px 103px,
        19px 157px,
        181px 47px;

    opacity: .94;

    z-index: 1;

}


/* =========================================================
   TEAL AURORA — EDGES
   ========================================================= */

.sky::after {

    content: "";

    position: absolute;

    inset: -20%;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at -3% 45%,
            rgba(37,211,206,.30),
            rgba(24,175,185,.17) 14%,
            rgba(20,140,170,.08) 27%,
            transparent 44%
        ),

        radial-gradient(
            ellipse at 103% 52%,
            rgba(53,216,209,.27),
            rgba(30,174,190,.15) 14%,
            rgba(20,120,170,.07) 29%,
            transparent 45%
        ),

        radial-gradient(
            ellipse at 50% -5%,
            rgba(40,190,210,.10),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 50% 105%,
            rgba(25,155,180,.08),
            transparent 40%
        );

    filter: blur(22px);

    z-index: 2;

}


/* =========================================================
   CLOUD LAYER
   ========================================================= */

.clouds {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 5;

}


/* =========================================================
   ALL CLOUDS
   ========================================================= */

.cloud {

    position: absolute;

    display: block;

    height: auto;

    pointer-events: none;

    user-select: none;

    will-change: transform;

}


/* =========================================================
   CLOUD A
   alienized-clouds-7081496.png

   Large, entering naturally from upper-left.
   ========================================================= */

.cloud-a {

    width: 760px;

    left: -330px;

    top: -90px;

    opacity: .92;

    filter:
        drop-shadow(
            0 15px 25px rgba(0,0,0,.10)
        );

    animation:
        driftA
        16s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD B
   95c-cloud-2421760.png

   Smaller and pushed toward the lower-right edge.
   NOT opposite Cloud A.
   ========================================================= */

.cloud-b {

    width: 500px;

    right: -250px;

    bottom: -85px;

    opacity: .62;

    filter:
        blur(.7px)
        drop-shadow(
            0 12px 20px rgba(0,0,0,.10)
        );

    animation:
        driftB
        20s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD C
   placidplace-sky-7296025.png

   Large cloud group drifting in from upper-right,
   positioned higher than Cloud B so nothing forms a grid.
   ========================================================= */

.cloud-c {

    width: 680px;

    right: -410px;

    top: 8%;

    opacity: .67;

    filter:
        drop-shadow(
            0 15px 25px rgba(0,0,0,.09)
        );

    animation:
        driftC
        22s
        ease-in-out
        infinite;

}


/* =========================================================
   SECOND CLOUD C
   Same asset, much smaller and faint.
   This makes the sky feel populated rather than arranged.
   ========================================================= */

.cloud-c-small {

    width: 280px;

    left: 7%;

    bottom: 8%;

    opacity: .27;

    filter:
        blur(2px);

    animation:
        driftD
        25s
        ease-in-out
        infinite;

}


/* =========================================================
   CLOUD MOVEMENT
   ========================================================= */

@keyframes driftA {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(22px, -10px, 0);
    }

}


@keyframes driftB {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(-18px, -9px, 0);
    }

}


@keyframes driftC {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(-25px, 11px, 0);
    }

}


@keyframes driftD {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(16px, -7px, 0);
    }

}


/* =========================================================
   FLOATING CENTRAL CONTENT
   ========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(760px, 82vw);

    text-align: center;

    z-index: 10;

    animation:
        dreamFloat
        7s
        ease-in-out
        infinite;

}


/* =========================================================
   TITLE
   ========================================================= */

.content h1 {

    margin: 0;

    font-size:
        clamp(40px, 5vw, 58px);

    font-weight: 300;

    letter-spacing: 8px;

    color: #fffaf0;

    text-shadow:

        0 0 18px rgba(255,255,255,.13),

        0 0 40px rgba(170,210,255,.10);

}


/* =========================================================
   SUBTITLE
   ========================================================= */

.content p {

    margin:
        14px 0 30px;

    font-size: 20px;

    line-height: 1.7;

    letter-spacing: 1px;

    color: #fffaf0;

    opacity: .80;

}


/* =========================================================
   BUTTON
   ========================================================= */

.enter-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 175px;

    padding:
        13px 30px;

    border:
        1px solid rgba(255,236,185,.58);

    border-radius:
        999px;

    background:
        rgba(255,248,220,.055);

    color:
        #fff8df;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter:
        blur(5px);

    box-shadow:
        0 0 18px rgba(255,235,180,.06);

    transition:
        background .4s ease,
        box-shadow .4s ease,
        transform .4s ease;

}


.enter-button:hover {

    background:
        rgba(255,248,220,.11);

    box-shadow:
        0 0 30px rgba(255,235,180,.15);

    transform:
        translateY(-2px);

}


/* =========================================================
   TITLE FLOAT
   ========================================================= */

@keyframes dreamFloat {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            translateY(0);

    }

    50% {

        transform:
            translate(-50%, -50%)
            translateY(-7px);

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cloud-a {

        width: 540px;

        left: -250px;

        top: -40px;

    }

    .cloud-b {

        width: 350px;

        right: -190px;

        bottom: -40px;

    }

    .cloud-c {

        width: 470px;

        right: -290px;

        top: 4%;

    }

    .cloud-c-small {

        width: 210px;

        left: -40px;

        bottom: 7%;

    }

    .content {

        width: 88vw;

    }

    .content h1 {

        font-size: 38px;

        letter-spacing: 5px;

    }

    .content p {

        font-size: 16px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .cloud,
    .content {

        animation: none;

    }

}

</style>

</head>


<body>

<div class="sky">


    <!-- =====================================================
         THREE DIFFERENT CLOUD ASSETS
         ===================================================== -->

    <div class="clouds">


        <!-- Cloud 1 -->
        <img
            src="alienized-clouds-7081496.png"
            class="cloud cloud-a"
            alt=""
        >


        <!-- Cloud 2 -->
        <img
            src="95c-cloud-2421760.png"
            class="cloud cloud-b"
            alt=""
        >


        <!-- Cloud 3 -->
        <img
            src="placidplace-sky-7296025.png"
            class="cloud cloud-c"
            alt=""
        >


        <!-- Smaller distant version of Cloud 3 -->
        <img
            src="placidplace-sky-7296025.png"
            class="cloud cloud-c-small"
            alt=""
        >

    </div>


    <!-- =====================================================
         DREAMER
         ===================================================== -->

    <main class="content">

        <h1>
            WELCOME, DREAMER.
        </h1>

        <p>
            The clouds keep more than rain.
        </p>

        <button
            class="enter-button"
            type="button"
            onclick="enterSky()"
        >
            ENTER THE SKY
        </button>

    </main>


</div>


<script>

function enterSky() {

    document.body.classList.add("entering");

}

</script>

</body>

</html>
```
